name: analyze
# The engine. The counter dispatches one run per submitted part; this workflow
# measures it, judges it, corrects it, proves the fix, and hands the delivery
# back. It is the same machine ./check.sh proves green on every commit.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: The job to run (32 hex characters)
        required: true
        type: string
      base_url:
        description: Where the counter lives, e.g. https://scheinman.example.com
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # One run per job. A duplicate dispatch of the same job never starts a second
  # engine, and the counter's own progress ladder ignores a late message anyway.
  group: analyze-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The engine needs the code and the rule base, not the 88 MB document
          # vault. Every submitted part pays for whatever this step downloads.
          sparse-checkout: |
            src
            data/rules
            pyproject.toml
            uv.lock
            .python-version
          sparse-checkout-cone-mode: false
      - name: Install uv (pinned, checksum-verified)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh -o /tmp/uv-install.sh
          echo "03b14f6a33d2b3c15a82115bf33fd38b095e1383cf9bc235afa3303aed80c63b  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: CAD kernel system libs
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1
      - name: Install project from the lockfile
        run: uv sync --locked
      - name: Refuse inputs that are not a job id and the configured counter
        # Inputs reach the shell only through env, never interpolated into the
        # script. The engine secret is only ever sent to the origin configured
        # as the repository variable SITE_ORIGIN.
        env:
          BASE_URL: ${{ inputs.base_url }}
          JOB_ID: ${{ inputs.job_id }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
        run: |
          [[ "$JOB_ID" =~ ^[0-9a-f]{32}$ ]] || { echo "job_id is not 32 hex characters"; exit 1; }
          [ -n "$SITE_ORIGIN" ] || { echo "set the repository variable SITE_ORIGIN"; exit 1; }
          [ "${BASE_URL%/}" = "${SITE_ORIGIN%/}" ] || { echo "base_url is not the configured counter"; exit 1; }
      - name: Run the submitted part and hand the delivery back
        env:
          ENGINE_SECRET: ${{ secrets.ENGINE_SECRET }}
          BASE_URL: ${{ inputs.base_url }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          uv run --locked python -m scheinman.deliver \
            --base-url "$BASE_URL" --job-id "$JOB_ID" --run-id "$RUN_ID"
      - name: Tell the counter if the engine broke, so no page spins forever
        # Plain curl on purpose: this step must work even when uv, the venv or
        # the system libraries are the thing that failed .
        if: failure() || cancelled()
        timeout-minutes: 2
        env:
          ENGINE_SECRET: ${{ secrets.ENGINE_SECRET }}
          BASE_URL: ${{ inputs.base_url }}
          JOB_ID: ${{ inputs.job_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            -X POST "$BASE_URL/api/jobs/$JOB_ID/callback" \
            -H "x-scheinman-engine: $ENGINE_SECRET" \
            -H "content-type: application/json" \
            -d "{\"status\":\"error\",\"reason\":\"The engine run failed before it could deliver. Run $RUN_ID holds the log.\"}"
      - name: Keep the delivery with the run only when something went wrong
        # The counter's archive is the permanent copy (decision 2026-09-01); a
        # second copy of every visitor's part here would be two stores with two
        # lifetimes. On failure the folder is what the owner needs to read.
        # Artifacts of a public repository are public: keep this off there.
        if: (failure() || cancelled()) && vars.KEEP_FAILED_DELIVERY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ inputs.job_id }}
          path: delivery
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true
