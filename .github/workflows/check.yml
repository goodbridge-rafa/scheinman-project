name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv (pinned, checksum-verified)
        run: |
          curl -LsSf https://astral.sh/uv/0.8.17/install.sh -o /tmp/uv-install.sh
          echo "03b14f6a33d2b3c15a82115bf33fd38b095e1383cf9bc235afa3303aed80c63b  /tmp/uv-install.sh" | sha256sum -c -
          sh /tmp/uv-install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: CAD kernel system libs
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1
      - name: Node for the counter's tests (node --test, no framework)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project from the lockfile
        run: uv sync --locked
      - name: Run the single verification command
        run: ./check.sh
